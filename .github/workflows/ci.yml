name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to immutable commit SHAs. A moving tag is a dependency
# somebody else can change after review.
jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS each run the whole suite; Windows runs its exhaustive
        # partition below. Every platform remains required.
        os: ['ubuntu-latest', 'macos-latest']
        node: ['24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      # No syntax step: the Lint workflow checks every tracked .mjs once, and
      # here it held each job's tests back by 14-40 s (2026-10-06).

      - name: Tests
        # Discovery belongs to the runner, independent of shell expansion.
        run: npm test
        env:
          # Test and file deadlines fail by name, including leaked workers.
          ACC_TEST_TIMEOUT_MS: '300000'
          ACC_TEST_FILE_TIMEOUT_MS: '600000'
          ACC_TEST_TIMINGS: ${{ runner.temp }}/acc-test-timings.jsonl
          # Git exports these into every child process. The suite spawns git in
          # temporary fixture repositories, and inheriting them makes those
          # commands operate on this checkout instead. This repository has been
          # damaged by exactly that once.
          GIT_DIR: ''
          GIT_WORK_TREE: ''

  windows-shards:
    name: windows-latest · node 24 · shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Deterministic partitions of the runner's complete discovery; no path
        # filters or hand-maintained test lists can silently exclude a file.
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      # Preserve the measured local-disk fixture placement: remote C: flushes
      # exceeded hook deadlines (windows-latest, 2026-10-02).
      - name: Temporary files on the local disk
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $dir | Out-Null
          "TEMP=$dir" >> $env:GITHUB_ENV
          "TMP=$dir" >> $env:GITHUB_ENV
      - name: Tests
        run: npm test -- --shard ${{ matrix.shard }}
        env:
          ACC_TEST_TIMEOUT_MS: '300000'
          ACC_TEST_FILE_TIMEOUT_MS: '600000'
          ACC_TEST_TIMINGS: ${{ runner.temp }}/acc-test-timings.jsonl
          ACC_TEST_FORCE_EXIT: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''

  windows-test:
    # Retain the existing required check name; cancellation/skips cannot make
    # this aggregate green when a partition has not passed.
    name: windows-latest · node 24
    needs: windows-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both Windows partitions
        env:
          SHARD_RESULT: ${{ needs['windows-shards'].result }}
        run: node --input-type=module -e "if (process.env.SHARD_RESULT !== 'success') process.exit(1)"

  real-clients:
    name: real clients · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Claude Code and Codex from npm, against a model stub on 127.0.0.1:
        # their own hook runners start ACC's hooks, in each platform's form.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Install the clients
        # Deliberately check current vendor compatibility on both platforms.
        # The logged versions are observations, not new certification captures.
        run: npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Versions
        run: |
          claude --version
          codex --version
      - name: Hooks, attachment and next-turn delivery through real clients
        run: node --test tests/acceptance/real-clients-stub.test.mjs
        env:
          ACC_REAL_CLIENTS: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''
      # An interactive client needs a terminal: a ConPTY through pywinpty on
      # Windows, Python's own pty module elsewhere.
      - name: A terminal for interactive clients
        if: runner.os == 'Windows'
        run: python -m pip install --quiet pywinpty
      - name: Live delivery wakes an idle interactive Claude Code session
        run: node --test tests/acceptance/real-claude-live-stub.test.mjs
        env:
          ACC_REAL_CLIENTS: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''

  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The installed package is checked where users install it.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: npm ci

      - name: Pack and verify the tarball
        # Installs into a clean directory with no workspace anywhere, then
        # drives doctor, a non-Git workspace, and an install/uninstall round
        # trip. Development cannot catch this: the workspace symlinks are always
        # present there, so an unbundled package imports fine until someone else
        # installs it.
        run: node scripts/verify-package.mjs

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to immutable commit SHAs. A moving tag is a dependency
# somebody else can change after review.
jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Each job here is the only run of the suite on its platform: no
        # developer machine is Linux or Windows. A green tick on one platform
        # says nothing about another, so the pull request waits for all three.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm ci

      - name: Syntax
        run: npm run check

      # The suite's temporary files on the runner's local disk. Its system disk,
      # C:, is remote: beside the suite a 4 KB flush there took 10-33 ms at the
      # median and up to 1.5 s, and on D: 0.5 ms and at most 27 ms
      # (windows-latest, 2026-10-02). The hook budget is the product's; that
      # disk is the runner's, and docs/TROUBLESHOOTING.md says what a machine
      # with one does.
      - name: Temporary files on the local disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $dir | Out-Null
          "TEMP=$dir" >> $env:GITHUB_ENV
          "TMP=$dir" >> $env:GITHUB_ENV

      - name: Tests
        # Unit, process, conformance, docs, security, and packaging - the whole
        # suite, because splitting it invites a job nobody notices is skipped.
        # The runner resolves its own file list and fails on an empty one: this
        # job once reported success having run zero tests, because the globs in
        # the old npm script are expanded by sh and passed through literally by
        # PowerShell.
        run: npm test
        env:
          # One hung test fails by name; see scripts/test-runner-plan.mjs.
          ACC_TEST_TIMEOUT_MS: '300000'
          # On Windows a child a failed test leaves behind can hold a file's
          # process open; its concurrency slot is released when its tests end.
          ACC_TEST_FORCE_EXIT: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
          # Git exports these into every child process. The suite spawns git in
          # temporary fixture repositories, and inheriting them makes those
          # commands operate on this checkout instead. This repository has been
          # damaged by exactly that once.
          GIT_DIR: ''
          GIT_WORK_TREE: ''

  real-clients:
    name: real clients · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Claude Code and Codex from npm, against a model stub on 127.0.0.1:
        # their own hook runners start ACC's hooks, in each platform's form.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Install the clients
        run: npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Versions
        run: |
          claude --version
          codex --version
      - name: Hooks, attachment and next-turn delivery through real clients
        run: node --test tests/acceptance/real-clients-stub.test.mjs
        env:
          ACC_REAL_CLIENTS: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''
      # An interactive client needs a terminal: a ConPTY through pywinpty on
      # Windows, Python's own pty module elsewhere.
      - name: A terminal for interactive clients
        if: runner.os == 'Windows'
        run: python -m pip install --quiet pywinpty
      - name: Live delivery wakes an idle interactive Claude Code session
        run: node --test tests/acceptance/real-claude-live-stub.test.mjs
        env:
          ACC_REAL_CLIENTS: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''

  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The installed package is checked where users install it.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: npm ci

      - name: Pack and verify the tarball
        # Installs into a clean directory with no workspace anywhere, then
        # drives doctor, a non-Git workspace, and an install/uninstall round
        # trip. Development cannot catch this: the workspace symlinks are always
        # present there, so an unbundled package imports fine until someone else
        # installs it.
        run: node scripts/verify-package.mjs

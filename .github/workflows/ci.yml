name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to immutable commit SHAs. A moving tag is a dependency
# somebody else can change after review.
jobs:
  plan:
    name: Plan validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      route: ${{ steps.route.outputs.route }}
      scope: ${{ steps.route.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Authenticate event and plan validation
        id: route
        run: node scripts/ci-validation.mjs plan
      - name: Record authenticated route
        continue-on-error: true
        run: node --input-type=module -e "console.log('CI_ROUTE=' + process.env.CI_ROUTE)"
        env:
          CI_ROUTE: ${{ steps.route.outputs.route }}

  full-linux:
    name: ubuntu-latest · node 24 · full
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      proof: ${{ steps.test.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-test
        id: test
        with:
          route: ${{ needs.plan.outputs.route }}
          worker: full-linux
          artifact: test-timings-ubuntu-latest-node-24-full

  full-macos:
    name: macos-latest · node 24 · full
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    # Keep required check/proof identities stable; use standard Intel macOS 26
    # capacity for the same planned darwin workload.
    runs-on: macos-26-intel
    timeout-minutes: 30
    outputs:
      proof: ${{ steps.test.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-test
        id: test
        with:
          route: ${{ needs.plan.outputs.route }}
          worker: full-macos
          artifact: test-timings-macos-latest-node-24-full

  full-windows-1:
    name: windows-latest · node 24 · shard 1/2
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      proof: ${{ steps.test.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-test
        id: test
        with:
          route: ${{ needs.plan.outputs.route }}
          worker: full-windows-1
          artifact: test-timings-windows-latest-node-24-shard-1-of-2

  full-windows-2:
    name: windows-latest · node 24 · shard 2/2
    needs: plan
    if: needs.plan.outputs.scope == 'full'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      proof: ${{ steps.test.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-test
        id: test
        with:
          route: ${{ needs.plan.outputs.route }}
          worker: full-windows-2
          artifact: test-timings-windows-latest-node-24-shard-2-of-2

  docs-linux:
    name: ubuntu-latest · node 24 · docs
    needs: plan
    if: needs.plan.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      proof: ${{ steps.test.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-test
        id: test
        with:
          route: ${{ needs.plan.outputs.route }}
          worker: docs-linux
          artifact: test-timings-ubuntu-latest-node-24-docs

  docs-macos:
    name: macos-latest · node 24 · docs
    needs: plan
    if: needs.plan.outputs.scope == 'docs'
    # Match the full darwin worker pool without changing its workload or identity.
    runs-on: macos-26-intel
    timeout-minutes: 30
    outputs:
      proof: ${{ steps.test.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-test
        id: test
        with:
          route: ${{ needs.plan.outputs.route }}
          worker: docs-macos
          artifact: test-timings-macos-latest-node-24-docs

  docs-windows:
    name: windows-latest · node 24 · docs
    needs: plan
    if: needs.plan.outputs.scope == 'docs'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      proof: ${{ steps.test.outputs.proof }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-test
        id: test
        with:
          route: ${{ needs.plan.outputs.route }}
          worker: docs-windows
          artifact: test-timings-windows-latest-node-24-docs

  linux-test:
    name: ubuntu-latest · node 24
    needs: [plan, full-linux, docs-linux]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require exact platform execution proof
        run: node scripts/ci-validation.mjs aggregate
        env:
          CI_ROUTE: ${{ needs.plan.outputs.route }}
          CI_PLATFORM: linux
          CI_NEEDS: ${{ toJSON(needs) }}

  macos-test:
    name: macos-latest · node 24
    needs: [plan, full-macos, docs-macos]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require exact platform execution proof
        run: node scripts/ci-validation.mjs aggregate
        env:
          CI_ROUTE: ${{ needs.plan.outputs.route }}
          CI_PLATFORM: darwin
          CI_NEEDS: ${{ toJSON(needs) }}

  windows-test:
    name: windows-latest · node 24
    needs: [plan, full-windows-1, full-windows-2, docs-windows]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Require exact platform execution proof
        run: node scripts/ci-validation.mjs aggregate
        env:
          CI_ROUTE: ${{ needs.plan.outputs.route }}
          CI_PLATFORM: win32
          CI_NEEDS: ${{ toJSON(needs) }}

  real-clients:
    needs: plan
    if: ${{ always() }}
    env:
      CI_ROUTE: ${{ needs.plan.outputs.route }}
      CI_WORKER: real-clients-${{ matrix.os }}
    name: real clients · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Claude Code and Codex from npm, against a model stub on 127.0.0.1:
        # their own hook runners start ACC's hooks, in each platform's form.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Authenticate planned auxiliary worker
        run: node scripts/ci-validation.mjs preflight
      - run: npm ci
      - name: Prepare Linux Codex sandbox
        if: runner.os == 'Linux'
        shell: bash
        # Codex requires distribution bubblewrap and Ubuntu's bwrap userns profile:
        # https://learn.chatgpt.com/docs/sandboxing#prerequisites
        # Load only that profile, preserving the runner's global userns policy.
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles apparmor-utils
          if test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          fi
          if test -f /etc/apparmor.d/bwrap-userns-restrict; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          fi
          command -v bwrap
          bwrap --version
          dpkg-query -W bubblewrap apparmor-profiles apparmor-utils
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true
      - name: Install the clients
        # Deliberately check current vendor compatibility on both platforms.
        # The logged versions are observations, not new certification captures.
        run: npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Versions
        run: |
          claude --version
          codex --version
      - name: Hooks, delivery and command approval through real clients
        run: node --test tests/acceptance/real-clients-stub.test.mjs tests/acceptance/codex-command-approval.test.mjs
        env:
          ACC_REAL_CLIENTS: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''
      # An interactive client needs a terminal: a ConPTY through pywinpty on
      # Windows, Python's own pty module elsewhere.
      - name: A terminal for interactive clients
        if: runner.os == 'Windows'
        run: python -m pip install --quiet pywinpty
      - name: Live delivery wakes an idle interactive Claude Code session
        run: node --test tests/acceptance/real-claude-live-stub.test.mjs
        env:
          ACC_REAL_CLIENTS: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''
      - name: Recheck auxiliary worker inputs
        run: node scripts/ci-validation.mjs preflight

  package:
    needs: plan
    if: ${{ always() }}
    env:
      CI_ROUTE: ${{ needs.plan.outputs.route }}
      CI_WORKER: package-${{ matrix.os }}
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The installed package is checked where users install it.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Authenticate planned auxiliary worker
        run: node scripts/ci-validation.mjs preflight
      - run: npm ci

      - name: Pack and verify the tarball
        # Installs into a clean directory with no workspace anywhere, then
        # drives doctor, a non-Git workspace, and an install/uninstall round
        # trip. Development cannot catch this: the workspace symlinks are always
        # present there, so an unbundled package imports fine until someone else
        # installs it.
        run: node scripts/verify-package.mjs
      - name: Recheck auxiliary worker inputs
        run: node scripts/ci-validation.mjs preflight

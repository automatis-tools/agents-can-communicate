name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax-check tracked .mjs files
        run: git ls-files -z '*.mjs' | xargs -0 -n1 node --check

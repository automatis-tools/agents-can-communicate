name: Lint

on:
  pull_request:
    # `edited` re-checks a description changed after the pull request was opened.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The attribution check reads every commit message, not just the tip.
          fetch-depth: 0
      - name: Syntax-check tracked .mjs files
        # An edited-event Lint success can replace a failed code-event check.
        # Every run therefore validates syntax as well as attribution.
        run: node scripts/check-syntax.mjs --tracked
      - name: Refuse Claude attribution in commit messages
        run: node scripts/check-commit-attribution.mjs --history HEAD
      - name: Refuse Claude attribution in the pull request description
        if: github.event_name == 'pull_request'
        env:
          # Passed through the environment, never interpolated into the command.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-commit-attribution.mjs --text-env PR_BODY
  pr-metadata:
    name: PR metadata
    # Main pushes retain the full Lint gate; descriptions exist only on PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-commit-attribution.mjs --text-env PR_BODY

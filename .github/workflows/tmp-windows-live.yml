name: tmp windows live

# Measurement only, on a throwaway branch: what Claude Code's inbox pipe, the
# Codex app-server daemon and a detached worker do on windows-latest, before
# 0.9.x relies on any of it.
on:
  push:
    branches: ['measure/windows-live']

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: Install the clients and a ConPTY binding
        run: |
          npm install --global @anthropic-ai/claude-code @openai/codex
          python -m pip install --quiet pywinpty
      - name: Versions
        run: |
          claude --version
          codex --version
          python --version
      - name: detached worker
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/tmp_windows_detached.mjs
      - name: Claude Code inbox pipe
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/tmp_windows_live_claude.mjs
      - name: Codex app-server daemon and proxy
        continue-on-error: true
        timeout-minutes: 8
        run: node scripts/tmp_windows_live_codex.mjs

  slow-hooks:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: three hook-heavy test files at once, slow operations logged
        continue-on-error: true
        timeout-minutes: 35
        run: node scripts/tmp_windows_slow_hooks.mjs 6

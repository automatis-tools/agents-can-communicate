name: tmp windows live

# Measurement only, on a throwaway branch: the Codex app-server daemon on
# windows-latest, started by a standard user since the runner's account is
# elevated, and a queued message through `codex app-server proxy`.
on:
  push:
    branches: ['measure/windows-live']

jobs:
  codex-user:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm install --global @openai/codex
      - name: a standard user runs the Codex daemon and a queued message
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/tmp_windows_codex_user.ps1

name: Release

# Manual only, and it does not publish. It builds the candidate and proves it
# installs; publication is a separate, deliberate act by a person.
on:
  workflow_dispatch:

jobs:
  candidate:
    name: build release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          ACC_TEST_TIMEOUT_MS: '300000'
          ACC_TEST_FILE_TIMEOUT_MS: '600000'
          ACC_TEST_TIMINGS: ${{ runner.temp }}/acc-test-timings.jsonl
          GIT_DIR: ''
          GIT_WORK_TREE: ''

      - name: Preserve timing diagnostics
        continue-on-error: true
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-timings-ubuntu-latest-node-24-full
          path: |
            ${{ runner.temp }}/acc-test-timings.jsonl
            ${{ runner.temp }}/acc-test-timings.jsonl.manifest.json
          if-no-files-found: warn

      - name: Prepare output directory
        run: mkdir -p dist

      - name: Pack
        run: npm pack --pack-destination dist

      - name: Verify the tarball as a user receives it
        run: node scripts/verify-package.mjs dist/*.tgz

      - name: Record the digest
        run: shasum -a 256 dist/*.tgz | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist/

name: Windows open refusal measurement
on:
  push:
    branches: [measure/windows-open-eperm]
permissions:
  contents: read
jobs:
  suite:
    name: suite · ${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rep: [a, b, c, d, e, f, g, h]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Temporary files on the local disk
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $dir | Out-Null
          "TEMP=$dir" >> $env:GITHUB_ENV
          "TMP=$dir" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Tests
        continue-on-error: true
        run: |
          npm test 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'suite.log')
          exit $LASTEXITCODE
        env:
          ACC_TEST_TIMEOUT_MS: '300000'
          ACC_TEST_FORCE_EXIT: '1'
          CI: 'true'
          GIT_DIR: ''
          GIT_WORK_TREE: ''
      - name: Open refusals
        if: always()
        shell: bash
        run: |
          {
            echo "### suite ${{ matrix.rep }}"
            grep -E '^ℹ (tests|pass|fail)' "$RUNNER_TEMP/suite.log" || true
            echo '```'
            grep -oE 'cannot safely open regular file \[[^]]*\]' "$RUNNER_TEMP/suite.log" | sed -E 's/[A-Z]:\\[^ '"'"']*//' | sort | uniq -c || true
            grep -E '^✖ ' "$RUNNER_TEMP/suite.log" | sort -u || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: suite-${{ matrix.rep }}
          path: ${{ runner.temp }}/suite.log
          retention-days: 7

name: tmp windows live 2

# Measurement only, on a throwaway branch: the flushes of each session start on
# Windows, and the whole suite with its temporary files on C: (the runner's
# remote system disk) twice and on D: (its local disk) once, at once, every hook
# timed and a canary flushing beside it.
on:
  push:
    branches: ['measure/windows-live2']

jobs:
  session-start-trace:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: each flush of a session start, alone
        run: |
          node scripts/tmp_session_start_trace.mjs 5
          node scripts/tmp_trace_summary.mjs fsync-trace.log

  suite:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        disk: [C1, C2, D]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: 'temporary files on D:'
        if: matrix.disk == 'D'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'tmp'
          New-Item -ItemType Directory -Force $dir | Out-Null
          "TEMP=$dir" >> $env:GITHUB_ENV
          "TMP=$dir" >> $env:GITHUB_ENV
      - name: the whole suite, with a canary beside it
        continue-on-error: true
        shell: pwsh
        run: |
          node -p "'tmpdir: ' + require('os').tmpdir()"
          $canary = Start-Process -PassThru -NoNewWindow node -ArgumentList 'scripts/tmp_canary.mjs',"$PWD\canary.log"
          $env:NODE_OPTIONS = "--import=file:///$((Resolve-Path scripts/tmp_hookcost.mjs).Path -replace '\\','/')"
          $env:TMP_HOOKCOST_LOG = "$PWD\hookcost.log"
          npm test 2>&1 | Tee-Object -FilePath suite.out | Select-String -Pattern "^ℹ |✖ "
          $env:NODE_OPTIONS = ''
          New-Item -ItemType File "$PWD\canary.log.stop" | Out-Null
          Start-Sleep -Seconds 2
          Stop-Process -Id $canary.Id -ErrorAction SilentlyContinue
        env:
          ACC_TEST_TIMEOUT_MS: '300000'
          ACC_TEST_FORCE_EXIT: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''
      - name: slow hooks and the machine around them
        if: always()
        run: node scripts/tmp_tail_summary.mjs hookcost.log canary.log 3000
      - name: the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suite-${{ matrix.disk }}
          path: |
            hookcost.log
            canary.log
            suite.out
          if-no-files-found: ignore

name: tmp windows live 2

# Measurement only, on a throwaway branch: the lock tests, the writer lock
# renamed aside and back while owner reads resolve it among them, four copies
# of the file at once, on the code before and
# after an answer outside the store needs the directory to be there to count as
# an escape.
on:
  push:
    branches: ['measure/windows-live2']

jobs:
  lock-churn:
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        code: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.code == 'after' && github.sha || 'f6ff0c1339427088aa6fed194b78694ebd8e5173' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: the churn, four at once, 30 rounds
        shell: pwsh
        run: |
          1..4 | ForEach-Object { Copy-Item packages/storage-filesystem/test/lock-changing-hands.test.mjs "packages/storage-filesystem/test/tmp_churn$_.test.mjs" }
          $files = (Get-ChildItem packages/storage-filesystem/test/tmp_churn*.test.mjs).FullName
          $escapes = 0
          for ($round = 1; $round -le 30; $round++) {
            # The whole file: on CI the answer named the store of a test that
            # ran before this one in the same file.
            node --test $files *> churn.out
            # A failure is printed twice, in place and in the summary.
            $found = @(Select-String -Path churn.out -Pattern 'called an escape: (.*)' |
              ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique)
            $escapes += $found.Count
            foreach ($sample in $found) { "round ${round}: $sample" }
            Select-String -Path churn.out -Pattern '^ℹ (pass|fail) ' | ForEach-Object { "round ${round}: $($_.Line)" }
            $lines = Get-Content churn.out
            $at = [array]::IndexOf($lines, ($lines | Where-Object { $_ -match '^✖ failing tests' } | Select-Object -First 1))
            if ($at -ge 0) { $lines[$at..([math]::Min($at + 40, $lines.Count - 1))] | ForEach-Object { "round ${round} | $_" } }
          }
          "code ${{ matrix.code }}: $escapes failed reads called an escape in 120 runs of the file"

name: tmp windows live 2

# Measurement only, on a throwaway branch: beside the whole suite, how long a
# 4 KB record takes to reach the disk on C: (where the suite's temporary files
# are) and on D: (the workspace), written plain, flushed, and written through -
# on two runners at once.
on:
  push:
    branches: ['measure/windows-live2']

jobs:
  flush-variants:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: the disks
        continue-on-error: true
        shell: pwsh
        run: |
          Get-PhysicalDisk | Select-Object DeviceId,FriendlyName,MediaType,BusType,Size | Format-Table
          Get-Volume | Where-Object DriveLetter | Select-Object DriveLetter,FileSystem,Size,SizeRemaining | Format-Table
          "tmpdir: $([System.IO.Path]::GetTempPath())  RUNNER_TEMP: $env:RUNNER_TEMP"
      - name: the whole suite, with the variants beside it
        continue-on-error: true
        shell: pwsh
        run: |
          $probe = Start-Process -PassThru -NoNewWindow node -ArgumentList 'scripts/tmp_flush_variants.mjs',"$PWD\variants.log",([System.IO.Path]::GetTempPath() + 'tmp-variants'),"$env:RUNNER_TEMP\tmp-variants"
          npm test 2>&1 | Tee-Object -FilePath suite.out | Select-String -Pattern "^ℹ |✖ "
          New-Item -ItemType File "$PWD\variants.log.stop" | Out-Null
          Start-Sleep -Seconds 2
          Stop-Process -Id $probe.Id -ErrorAction SilentlyContinue
        env:
          ACC_TEST_TIMEOUT_MS: '300000'
          ACC_TEST_FORCE_EXIT: '1'
          GIT_DIR: ''
          GIT_WORK_TREE: ''
      - name: each disk and way of writing
        if: always()
        run: node scripts/tmp_flush_variants_summary.mjs variants.log
      - name: the logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: variants-${{ matrix.run }}
          path: |
            variants.log
            suite.out
          if-no-files-found: ignore

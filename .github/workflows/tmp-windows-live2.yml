name: tmp windows live 2

# Measurement only, on a throwaway branch: every flush and rename of a first
# session start, a second live session's start, a turn and a third start on
# Windows - alone, and beside a packed test that flushes thousands of times.
on:
  push:
    branches: ['measure/windows-live2']

jobs:
  session-start-trace:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - name: alone
        run: |
          node scripts/tmp_session_start_trace.mjs 5
          node scripts/tmp_trace_summary.mjs fsync-trace.log
      - name: beside a packed test
        shell: pwsh
        run: |
          $packed = Start-Process -PassThru -NoNewWindow node -ArgumentList '--test','tests/acceptance/context-reminders-packed.test.mjs'
          Start-Sleep -Seconds 20
          node scripts/tmp_session_start_trace.mjs 5
          node scripts/tmp_trace_summary.mjs fsync-trace.log
          Stop-Process -Id $packed.Id -ErrorAction SilentlyContinue
